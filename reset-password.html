<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reset Password, Soul Land Universe</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css?v=1072">
</head>
<body class="cosmic-bg">

<header class="site-header">
  <div class="header-inner">
    <div class="brand" onclick="location.href='index'" style="cursor:pointer;">
      <svg class="brand-logo" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <polygon points="50,4 96,50 50,96 4,50" stroke="#cfe0ff" stroke-width="4" fill="rgba(255,255,255,0.04)"/>
        <polygon points="50,26 74,50 50,74 26,50" stroke="#cfe0ff" stroke-width="3"/>
        <circle cx="50" cy="50" r="6" fill="#cfe0ff"/>
      </svg>
      <div class="brand-text"><h1>Soul Land Universe</h1></div>
    </div>
  </div>
</header>

<div class="reset-wrap">
  <div class="reset-card">

    <div id="checkingView" class="reset-view active" style="text-align:center;">
      <div class="loading-spinner"></div>
      <p style="color:var(--text-dim); font-size:13.5px; margin-top:16px;">Verifying your link…</p>
    </div>

    <div id="invalidView" class="reset-view">
      <h2 class="reset-title">Link expired or invalid</h2>
      <p class="reset-subtitle">This password reset link is no longer valid. Go back and request a new one from the login page.</p>
    </div>

    <div id="formView" class="reset-view">
      <h2 class="reset-title">Reset your password</h2>
      <p class="reset-subtitle" id="resetForEmail"></p>

      <div class="hub-error" id="resetError"></div>
      <div class="hub-success" id="resetSuccess"></div>

      <div class="hub-field">
        <label>New Password</label>
        <input type="password" id="newPass" placeholder="8+ chars, upper/lowercase, a number">
      </div>
      <div class="hub-field">
        <label>Confirm New Password</label>
        <input type="password" id="newPassConfirm" placeholder="Type it again">
      </div>
      <button class="hub-submit" id="submitResetBtn">Set New Password</button>
    </div>

    <div id="doneView" class="reset-view" style="text-align:center;">
      <h2 class="reset-title">Password updated ✅</h2>
      <p class="reset-subtitle">You can now log in with your new password.</p>
      <a href="guides-hub" class="hub-submit" style="display:block; text-decoration:none; box-sizing:border-box;">Go to Log In</a>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-check-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
