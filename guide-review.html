<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard: Soul Land Universe</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css?v=1078">
<meta name="robots" content="noindex, nofollow">
</head>
<body class="has-fixed-footer">

<div id="adminGate" class="admin-gate">
  <div id="adminGateLoading" class="admin-gate-spinner-wrap"><div class="admin-gate-spinner"></div></div>
  <div id="adminGateForm" class="admin-gate-card" style="display:none;">
    <h2 class="admin-gate-title">Admin Access</h2>
    <p class="admin-gate-subtitle">This page is restricted to site administrators.</p>
    <div id="adminGateError" class="admin-gate-error" style="display:none;"></div>
    <div class="admin-gate-field"><label>Email</label><input type="email" id="adminGateEmail" placeholder="you@example.com"></div>
    <div class="admin-gate-field"><label>Password</label><input type="password" id="adminGatePassword" placeholder="••••••••"></div>
    <button id="adminGateLoginBtn" class="admin-gate-submit">Log In</button>
  </div>
  <div id="adminGateDenied" class="admin-gate-card admin-gate-denied" style="display:none;">
    <h2 class="admin-gate-title">Access denied</h2>
    <p class="admin-gate-subtitle">This account doesn't have admin access.</p>
    <button id="adminGateLogoutBtn" class="admin-gate-logout">Log Out</button>
  </div>
</div>

<header class="site-header">
  <div class="header-inner">
    <div class="brand" style="cursor:default;">
      <div class="eyebrow">Soul Land · Awakening World</div>
      <h1 data-i18n="gr_admin_dashboard">Admin Dashboard</h1>
    </div>
    <div></div>
    <div class="editor-header-actions">
      <a href="guides-hub" class="btn" style="text-decoration:none;" data-i18n="gr_back_dashboard_link">← Back to Dashboard</a>
    </div>
  </div>
</header>

<div class="dash-shell">
  <main class="dash-main" style="width:100%;">
    <div class="dash-stats-row" id="dashStatsRow"></div>

    <!-- Review Queue view -->
    <div id="viewQueue" class="dash-view active">
      <div class="dash-toolbar">
        <input type="text" id="queueSearch" placeholder="Search guides…" data-i18n-placeholder="gr_search_guides">
        <select id="queueLangFilter">
          <option value="" data-i18n="gr_all_languages">All Languages</option>
          <option>English</option><option>Français</option><option>Español</option><option>Português</option>
          <option>ไทย</option><option>Filipino</option><option>Bahasa Indonesia</option><option>Tiếng Việt</option>
        </select>
      </div>
      <div id="queueGrid" class="dash-card-grid"></div>
    </div>
  </main>
</div>

<footer class="site-footer">
  <nav class="footer-menu">
    <a href="index">← Back to Wiki</a>
    <a href="guides-hub">My Guides Dashboard</a>
  </nav>
  <span>Fan-made · Soul Land: Awakening World</span>
</footer>

<!-- Guide detail modal -->
<div id="guideModal" class="itemcard-modal">
  <div class="itemcard-modal-inner" style="width:96vw; height:92vh; max-width:none; max-height:none;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:12px;">
      <div>
        <h3 id="modalGuideTitle" style="margin:0 0 4px;">Guide title</h3>
        <div id="modalGuideMeta" style="font-size:12.5px; color:var(--text-dim);"></div>
      </div>
      <div class="btn" onclick="closeGuideModal()" data-i18n="gr_close">✕ Close</div>
    </div>
    <div class="guide-modal-split">
      <div id="modalGuideBody" class="guide-modal-main"></div>
      <div class="guide-modal-side">
        <div id="modalGuideActions"></div>
        <div id="modalGuideLog"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-check-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script>applyCachedLanguageInstantly();</script>
<script src="js/custom-dialog.js"></script>
<script src="js/notifications.js"></script>
<script src="js/admin-gate.js"></script>
<script>
auth.onAuthStateChanged((user) => {
  if (user) initReviewQueuePage();
});
</script>
<script src="js/guide-review.js"></script>
</body>
</html>
